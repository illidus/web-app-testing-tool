[pytest]
# Pytest configuration for bulk test runner

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --json-report
    --json-report-file=out/results.json
    --json-report-indent=2

# Markers for test categorization
markers =
    synthetic: Tests using synthetic datasets
    sanitized: Tests using sanitized datasets
    sensitive: Tests using real-sensitive datasets (requires --include-sensitive)
    flaky: Tests known to be flaky

# Directories to ignore
norecursedirs = .git .venv venv __pycache__ *.egg-info out bugs

# Test timeout (per test, in seconds)

# Logging
log_cli = false
log_cli_level = INFO
log_file = out/pytest.log
log_file_level = DEBUG

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
